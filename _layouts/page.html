---
layout: default
---
<article class="page{% if page.wide %} page-wide{% endif %}">
  <header class="page-head">
    {% if page.parent %}<p class="eyebrow"><a href="{{ page.parent.url | relative_url }}">{{ page.parent.title }}</a></p>{% elsif page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="lead">{{ page.lead }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
