title: Stefan Decker's Homepage
description: >-
  Professor Stefan Decker, RWTH Aachen University and Director of Fraunhofer FIT.
  Knowledge Graphs, Semantic Web, data spaces and AI.
url: https://www.stefandecker.org
lang: en
timezone: Europe/Berlin
author: Stefan Decker

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      permalink: /blog/:year/:month/:day/:title/

markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
