<svg class="hero-graph" viewBox="0 0 640 520" role="img" aria-labelledby="hero-graph-title">
  <title id="hero-graph-title">Portrait of Stefan Decker as the subject of a small RDF graph: professor at RWTH Aachen University, director of Fraunhofer FIT, working on the Semantic Web, Knowledge Graphs, Data Spaces and Generative AI</title>
  <defs>
    <marker id="hg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="hg-arrowhead" d="M0 0L10 5L0 10z"/>
    </marker>
    <clipPath id="hg-portrait"><circle cx="320" cy="232" r="104"/></clipPath>
  </defs>
  <g class="hg-edges">
    <line class="hg-edge" x1="228.6" y1="163.9" x2="127.2" y2="88.3" marker-end="url(#hg-arrow)"/>
    <line class="hg-edge" x1="411.1" y1="163.5" x2="509.9" y2="89.1" marker-end="url(#hg-arrow)"/>
    <line class="hg-edge" x1="206.8" y1="245.7" x2="138.3" y2="254" marker-end="url(#hg-arrow)"/>
    <line class="hg-edge" x1="433.2" y1="245.8" x2="494.5" y2="253.3" marker-end="url(#hg-arrow)"/>
    <line class="hg-edge" x1="251.6" y1="323.2" x2="175.6" y2="424.5" marker-end="url(#hg-arrow)"/>
    <line class="hg-edge" x1="388.9" y1="322.8" x2="466.4" y2="425" marker-end="url(#hg-arrow)"/>
  </g>
  <circle class="hg-halo" cx="320" cy="232" r="113"/>
  <image href="{{ '/assets/img/stefan-decker.jpg' | relative_url }}" x="193.5" y="138" width="262" height="343.1" clip-path="url(#hg-portrait)" preserveAspectRatio="xMidYMid slice"/>
  <circle class="hg-ring" cx="320" cy="232" r="104"/>
  <g class="hg-labels">
    <text class="hg-pred" x="167.9" y="130.1" text-anchor="end">:worksOn</text>
    <text class="hg-pred" x="470.5" y="130.3" text-anchor="start">:worksOn</text>
    <text class="hg-pred" x="161.1" y="239.8" text-anchor="middle">:worksOn</text>
    <text class="hg-pred" x="474.1" y="239.5" text-anchor="middle">:worksOn</text>
    <text class="hg-pred" x="203.6" y="377.8" text-anchor="end">:professorAt</text>
    <text class="hg-pred" x="437.7" y="377.9" text-anchor="start">:directorOf</text>
  </g>
  <g class="hg-nodes">
    <g class="hg-node"><ellipse cx="92" cy="62" rx="70" ry="26"/><text x="92" y="67.5" text-anchor="middle">Semantic Web</text></g>
    <g class="hg-node"><ellipse cx="546" cy="62" rx="86" ry="26"/><text x="546" y="67.5" text-anchor="middle">Knowledge Graphs</text></g>
    <g class="hg-node"><ellipse cx="72" cy="262" rx="64" ry="26"/><text x="72" y="267.5" text-anchor="middle">Data Spaces</text></g>
    <g class="hg-node"><ellipse cx="566" cy="262" rx="70" ry="26"/><text x="566" y="267.5" text-anchor="middle">Generative AI</text></g>
    <g class="hg-node"><ellipse cx="152" cy="456" rx="112" ry="28"/><text x="152" y="461.5" text-anchor="middle">RWTH Aachen University</text></g>
    <g class="hg-node"><ellipse cx="490" cy="456" rx="80" ry="28"/><text x="490" y="461.5" text-anchor="middle">Fraunhofer FIT</text></g>
  </g>
</svg>
